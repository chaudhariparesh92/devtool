<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0b16" />

    <!-- Fallback tags for crawlers/social bots that do not run JavaScript.
         react-helmet-async (SeoHead.jsx) replaces these per page once React loads. -->
    <title>onlinedevelopertool.com/ - Free Online JSON, JWT &amp; Base64 Developer Tools</title>
    <meta name="description" content="Use free developer tools at onlinedevelopertool.com/ to format JSON, decode JWT, encode Base64 and generate UUIDs in your browser. No signup, private by design." />
    <link rel="canonical" href="https://onlinedevelopertool.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FREE Developer Tool" />
    <meta property="og:title" content="onlinedevelopertool.com/ - Free Online JSON, JWT & Base64 Developer Tools" />
    <meta property="og:description" content="Free, private, browser-based developer tools: format JSON, decode JWT, encode Base64, generate UUIDs and more." />
    <meta property="og:url" content="https://onlinedevelopertool.com/" />
    <meta property="og:image" content="https://onlinedevelopertool.com/images/og-onlinedevelopertool.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Performance: warm up the ad connection; the ad script itself is async so it never blocks rendering. -->
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
    <!-- Replace ca-pub-XXXXXXXXXXXXXXXX with your real AdSense publisher ID (same one used in AdSlot.jsx). -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Free online developer tools - onlinedevelopertool.com/</h1>
      <p>Format JSON, decode JWT, encode Base64, generate UUIDs and more. These tools need JavaScript enabled to run in your browser.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
