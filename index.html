<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0b16" />

    <!-- SEO-HEAD:START
         Fallback tags for dev mode and any URL that has no prerendered page. After `npm run build`,
         scripts/prerender.mjs rewrites everything between these markers for every route, and
         react-helmet-async (SeoHead.jsx) takes over once React loads. The data-rh attribute tells
         Helmet these tags are managed, so it replaces them instead of adding duplicates. -->
    <title>Online Developer Tools - Free JSON, JWT, Base64 & More</title>
    <meta data-rh="true" name="description" content="Free online developer tools for JSON, JWT, Base64, UUID, hashing, URLs, timestamps, regex, XML, YAML and more. Fast browser-based utilities with no signup." />
    <link data-rh="true" rel="canonical" href="https://onlinedevelopertool.com/" />
    <meta data-rh="true" name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="OnlineDeveloperTool" />
    <meta data-rh="true" property="og:title" content="Online Developer Tools - Free JSON, JWT, Base64 & More" />
    <meta data-rh="true" property="og:description" content="Free browser-based developer tools for JSON, JWT, Base64, UUID, hashing, timestamps, regex, XML, YAML and more. No signup required." />
    <meta data-rh="true" property="og:url" content="https://onlinedevelopertool.com/" />
    <meta data-rh="true" property="og:image" content="https://onlinedevelopertool.com/images/og-onlinedevelopertool.webp" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" property="og:image:alt" content="Free Online Developer Tools" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="Online Developer Tools - Free JSON, JWT, Base64 & More" />
    <meta data-rh="true" name="twitter:description" content="Free browser-based developer tools for JSON, JWT, Base64, UUID, hashing, timestamps, regex, XML, YAML and more. No signup required." />
    <meta data-rh="true" name="twitter:image" content="https://onlinedevelopertool.com/images/og-onlinedevelopertool.webp" />
    <meta data-rh="true" name="twitter:url" content="https://onlinedevelopertool.com/" />
    <!-- SEO-HEAD:END -->

    <link rel="icon" href="/favicon.ico" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Performance: warm up the ad connection; the ad script itself is async so it never blocks rendering. -->
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
    <!-- Replace ca-pub-XXXXXXXXXXXXXXXX with your real AdSense publisher ID (same one used in AdSlot.jsx). -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>Free online developer tools: JSON Formatter, JWT Decoder, Base64 Encoder, UUID Generator and more. The tools need JavaScript enabled to run in your browser.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
